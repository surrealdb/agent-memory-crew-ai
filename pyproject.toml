[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-crew-ai"
version = "0.3.0"
description = "SurrealDB AgentMemory memory tools and automatic memory for CrewAI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SurrealDB" }]
keywords = ["surrealdb", "agent_memory", "crewai", "agent", "memory", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
]
dependencies = [
    "crewai>=1.5.0",
    # AgentMemory ships inside the SurrealDB Python SDK from the v3 alpha onward.
    "surrealdb[memory]>=3.0.0b8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://surrealdb.com/agent-memory"
Source = "https://github.com/surrealdb/agent-memory-crew-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
