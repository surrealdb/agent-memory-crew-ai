[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectron-crew-ai"
version = "0.1.0"
description = "SurrealDB Spectron memory tools and automatic memory for CrewAI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SurrealDB" }]
keywords = ["surrealdb", "spectron", "crewai", "agent", "memory", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
]
dependencies = [
    "crewai>=1.5.0",
    # Spectron ships inside the SurrealDB Python SDK from the v3 alpha onward.
    "surrealdb>=3.0.0a1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://surrealdb.com/platform/spectron"
Source = "https://github.com/surrealdb-dev/spectron-crew-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/spectron_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
